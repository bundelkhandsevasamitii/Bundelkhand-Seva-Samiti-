<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Volunteer Registration | Bundelkhand Seva Samiti</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fa;
    color:#222;
    min-height:100vh;
}

/* =========================
   WATERMARK LOGO
========================= */

body::before{
    content:"";
    position:fixed;

    top:50%;
    left:50%;

    width:380px;
    height:380px;

    transform:translate(-50%,-50%);

    background-image:url("https://i.imgur.com/Fk73yNP.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;

    opacity:0.08;

    z-index:-1;

    pointer-events:none;
}


/* =========================
   HEADER
========================= */

header{
    background:#124e78;
    color:white;

    padding:16px 7%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.home-btn{
    text-decoration:none;
    color:white;

    background:#e67e22;

    padding:10px 18px;

    border-radius:7px;
}


/* =========================
   MAIN
========================= */

.container{
    max-width:850px;

    margin:40px auto;

    padding:0 18px;
}

.form-box{
    background:rgba(255,255,255,0.96);

    padding:35px;

    border-radius:16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.10);
}


/* =========================
   TITLE
========================= */

.title{
    text-align:center;

    margin-bottom:25px;
}

.title h1{
    color:#124e78;

    font-size:32px;
}

.title p{
    color:#666;

    margin-top:8px;
}


/* =========================
   JOINING FEE
========================= */

.fee{
    background:#fff4e7;

    border:1px solid #f0c58e;

    border-radius:10px;

    padding:18px;

    text-align:center;

    margin-bottom:25px;
}

.fee-title{
    color:#555;

    font-weight:bold;
}

.fee-amount{
    color:#e67e22;

    font-size:28px;

    font-weight:bold;

    margin-top:5px;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:19px;
}

.field{
    display:flex;
    flex-direction:column;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;

    margin-bottom:7px;
}

input{
    padding:13px;

    border:1px solid #ccc;

    border-radius:7px;

    font-size:15px;

    outline:none;

    background:white;
}

input:focus{
    border-color:#124e78;

    box-shadow:
        0 0 0 2px rgba(18,78,120,.08);
}


/* =========================
   FILE
========================= */

.file-box{
    border:2px dashed #bbb;

    padding:18px;

    border-radius:8px;

    background:#fafafa;
}

.file-box input{
    border:none;

    padding:5px;

    width:100%;
}

.note{
    color:#666;

    font-size:13px;

    margin-top:8px;
}


/* =========================
   SUBMIT BUTTON
========================= */

.submit-btn{
    width:100%;

    border:none;

    padding:15px;

    margin-top:25px;

    background:#124e78;

    color:white;

    border-radius:8px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.submit-btn:hover{
    background:#0d3d5e;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    body::before{
        width:280px;
        height:280px;

        opacity:0.07;
    }

    header{
        padding:14px 5%;
    }

    .logo{
        font-size:17px;
    }

    .home-btn{
        padding:8px 13px;

        font-size:14px;
    }

    .container{
        margin:25px auto;
    }

    .form-box{
        padding:23px 17px;
    }

    .title h1{
        font-size:26px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Bundelkhand Seva Samiti
    </div>

    <a href="index.html" class="home-btn">
        Home
    </a>

</header>



<!-- MAIN -->

<div class="container">

    <div class="form-box">


        <!-- TITLE -->

        <div class="title">

            <h1>
                Volunteer Registration
            </h1>

            <p>
                Bundelkhand Seva Samiti से जुड़ने के लिए आवेदन करें
            </p>

        </div>



        <!-- JOINING FEE -->

        <div class="fee">

            <div class="fee-title">
                Volunteer Joining Fee
            </div>

            <div class="fee-amount">
                ₹100
            </div>

            <div class="note">
                Payment की verification Manager द्वारा की जाएगी।
            </div>

        </div>



        <!-- FORM -->

        <form id="volunteerForm">


            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="field">

                    <label>
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="अपना पूरा नाम"
                        required
                    >

                </div>



                <!-- DISTRICT -->

                <div class="field">

                    <label>
                        District *
                    </label>

                    <input
                        type="text"
                        id="district"
                        placeholder="जिला"
                        required
                    >

                </div>



                <!-- STATE -->

                <div class="field">

                    <label>
                        State *
                    </label>

                    <input
                        type="text"
                        id="state"
                        value="Madhya Pradesh"
                        placeholder="राज्य"
                        required
                    >

                </div>



                <!-- VILLAGE -->

                <div class="field">

                    <label>
                        Village / City *
                    </label>

                    <input
                        type="text"
                        id="villageCity"
                        placeholder="गाँव / शहर"
                        required
                    >

                </div>



                <!-- HOUSE -->

                <div class="field">

                    <label>
                        House No. *
                    </label>

                    <input
                        type="text"
                        id="houseNo"
                        placeholder="मकान नंबर / पता"
                        required
                    >

                </div>



                <!-- MOBILE -->

                <div class="field">

                    <label>
                        Mobile Number *
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="10 अंकों का मोबाइल नंबर"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="field full">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                    >

                </div>



                <!-- PAYMENT PROOF -->

                <div class="field full">

                    <label>
                        Payment Proof *
                    </label>

                    <div class="file-box">

                        <input
                            type="file"
                            id="paymentProof"
                            accept=".jpg,.jpeg,.png,.pdf"
                            required
                        >

                        <div class="note">
                            JPG, JPEG, PNG या PDF • Maximum 5 MB
                        </div>

                    </div>

                </div>


            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
            >
                Submit Application
            </button>


        </form>

    </div>

</div>


</body>
</html>
